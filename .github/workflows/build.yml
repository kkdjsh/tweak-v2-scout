name: Build v2scout

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos + toolchain + sdk
        run: |
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          sudo git clone https://github.com/theos/toolchain.git /opt/theos/toolchain
          sudo git clone https://github.com/theos/sdks.git /opt/theos/sdks
          ls /opt/theos
          ls /opt/theos/toolchain
          ls /opt/theos/sdks

      - name: Build
        run: |
          { make package THEOS=/opt/theos FINALPACKAGE=1 ; } 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
        shell: bash

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2scout_build_log
          path: build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: v2scout_deb
          path: packages/*.deb
