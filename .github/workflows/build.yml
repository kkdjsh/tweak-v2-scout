name: Build v2scout

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          uname -a
          xcodebuild -version
          xcode-select -p

      - name: Install Theos
        run: |
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos

      - name: Build
        run: |
          make package THEOS=/opt/theos FINALPACKAGE=1
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: v2scout_deb
          path: packages/*.deb
