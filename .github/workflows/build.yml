name: Build v2scout

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  THEOS: /Users/runner/theos

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show env
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Clone theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS

      - name: Build
        run: |
          { make package FINALPACKAGE=1 ; } 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
        shell: bash

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2scout_build_log
          path: build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: v2scout_deb
          path: packages/*.deb
